<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long-Horizon — Brain Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
#header { position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px; background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); z-index: 10; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #1a1a2e; }
#header h1 { font-size: 18px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#stats { font-size: 13px; color: #888; }
#tooltip { position: fixed; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity 0.2s; max-width: 300px; z-index: 100; }
#tooltip h3 { color: #667eea; margin-bottom: 4px; }
#tooltip .type { color: #764ba2; font-size: 11px; text-transform: uppercase; }
#tooltip .edges { color: #888; margin-top: 6px; font-size: 12px; }
canvas { display: block; }
#legend { position: fixed; bottom: 16px; left: 16px; background: rgba(26,26,46,0.9); border-radius: 8px; padding: 12px; font-size: 12px; }
#legend div { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
#legend span { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#dropzone { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,10,15,0.95); z-index: 50; }
#dropzone.hidden { display: none; }
#dropzone p { font-size: 20px; color: #667eea; }
</style>
</head>
<body>
<div id="header">
  <h1>🧠 Long-Horizon Brain</h1>
  <span id="stats"></span>
</div>
<div id="tooltip"></div>
<div id="legend">
  <div><span style="background:#667eea"></span> context</div>
  <div><span style="background:#f093fb"></span> decision</div>
  <div><span style="background:#4facfe"></span> task</div>
  <div><span style="background:#43e97b"></span> lesson</div>
  <div><span style="background:#fa709a"></span> pattern</div>
  <div><span style="background:#fee140"></span> milestone</div>
</div>
<div id="dropzone">
  <p>Drop graph-index.json here<br><small>or paste it from .long-horizon/brain/graph-index.json</small></p>
</div>
<canvas id="canvas"></canvas>
<script>
const COLORS = { context:'#667eea', decision:'#f093fb', task:'#4facfe', lesson:'#43e97b', pattern:'#fa709a', milestone:'#fee140' };
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, nodes = [], edges = [], dragging = null, mouse = {x:0,y:0}, hovered = null;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function loadGraph(data) {
  document.getElementById('dropzone').classList.add('hidden');
  nodes = []; edges = [];
  const entries = Object.entries(data.nodes);
  const nodeMap = {};
  entries.forEach(([id, n], i) => {
    const angle = (i / entries.length) * Math.PI * 2;
    const r = Math.min(W, H) * 0.3;
    const node = { id, ...n, x: W/2 + Math.cos(angle)*r + (Math.random()-0.5)*50, y: H/2 + Math.sin(angle)*r + (Math.random()-0.5)*50, vx: 0, vy: 0, radius: id === data.root_node ? 18 : 10 };
    nodes.push(node);
    nodeMap[id] = node;
  });
  (data.edges || []).forEach(e => {
    if (nodeMap[e.source] && nodeMap[e.target]) edges.push({ source: nodeMap[e.source], target: nodeMap[e.target], relation: e.relation });
  });
  document.getElementById('stats').textContent = `${nodes.length} nodes · ${edges.length} edges`;
  animate();
}

function simulate() {
  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      let dx = nodes[j].x - nodes[i].x, dy = nodes[j].y - nodes[i].y;
      let d = Math.sqrt(dx*dx + dy*dy) || 1;
      let force = 800 / (d * d);
      nodes[i].vx -= (dx/d)*force; nodes[i].vy -= (dy/d)*force;
      nodes[j].vx += (dx/d)*force; nodes[j].vy += (dy/d)*force;
    }
  }
  // Attraction (edges)
  edges.forEach(e => {
    let dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
    let d = Math.sqrt(dx*dx + dy*dy) || 1;
    let force = (d - 120) * 0.005;
    e.source.vx += (dx/d)*force; e.source.vy += (dy/d)*force;
    e.target.vx -= (dx/d)*force; e.target.vy -= (dy/d)*force;
  });
  // Center gravity
  nodes.forEach(n => {
    n.vx += (W/2 - n.x) * 0.0005;
    n.vy += (H/2 - n.y) * 0.0005;
    n.vx *= 0.9; n.vy *= 0.9;
    if (n !== dragging) { n.x += n.vx; n.y += n.vy; }
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // Edges
  edges.forEach(e => {
    ctx.beginPath(); ctx.moveTo(e.source.x, e.source.y); ctx.lineTo(e.target.x, e.target.y);
    ctx.strokeStyle = 'rgba(102,126,234,0.2)'; ctx.lineWidth = 1; ctx.stroke();
  });
  // Nodes
  nodes.forEach(n => {
    ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI*2);
    ctx.fillStyle = COLORS[n.type] || '#888';
    if (n === hovered) { ctx.shadowColor = COLORS[n.type]; ctx.shadowBlur = 20; }
    ctx.fill(); ctx.shadowBlur = 0;
    // Label for hovered
    if (n === hovered) {
      ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(n.title, n.x, n.y - n.radius - 8);
    }
  });
}

function animate() { simulate(); draw(); requestAnimationFrame(animate); }

// Interaction
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (dragging) { dragging.x = e.clientX; dragging.y = e.clientY; return; }
  hovered = nodes.find(n => Math.hypot(n.x-e.clientX, n.y-e.clientY) < n.radius+4) || null;
  const tt = document.getElementById('tooltip');
  if (hovered) {
    tt.innerHTML = `<div class="type">${hovered.type}</div><h3>${hovered.title}</h3><div class="edges">↗ ${(hovered.edges_out||[]).length} out · ↙ ${(hovered.edges_in||[]).length} in</div>`;
    tt.style.opacity = 1; tt.style.left = (e.clientX+16)+'px'; tt.style.top = (e.clientY+16)+'px';
  } else { tt.style.opacity = 0; }
});
canvas.addEventListener('mousedown', e => { dragging = nodes.find(n => Math.hypot(n.x-e.clientX, n.y-e.clientY) < n.radius+4) || null; });
canvas.addEventListener('mouseup', () => { dragging = null; });

// Drop zone
const dz = document.getElementById('dropzone');
document.addEventListener('dragover', e => { e.preventDefault(); dz.classList.remove('hidden'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) { const r = new FileReader(); r.onload = () => loadGraph(JSON.parse(r.result)); r.readAsText(file); }
});

// Also try to load from URL param or fetch local
const params = new URLSearchParams(location.search);
if (params.get('file')) {
  fetch(params.get('file')).then(r => r.json()).then(loadGraph).catch(() => {});
} else {
  fetch('.long-horizon/brain/graph-index.json').then(r => r.json()).then(loadGraph).catch(() => {});
}
</script>
</body>
</html>
